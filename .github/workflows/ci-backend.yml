name: CI — Backend

on:
  pull_request:
    branches:
      - main
  
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fatogeral
          POSTGRES_USER: fatogeral
          POSTGRES_PASSWORD: fatogeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: maven

      - name: Build e testes
        run: mvn clean verify
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_USERNAME: fatogeral
          DB_PASSWORD: fatogeral
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Upload relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/target/surefire-reports/