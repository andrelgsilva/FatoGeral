spring:
  datasource:
    url: jdbc:postgresql://dpg-d8c5pp8jo6nc73eit4ng-a.oregon-postgres.render.com:5432/fatogeral
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    org.flywaydb: INFO

cors:
  allowed-origins:
    - ${CORS_ALLOWED_ORIGINS:https://witty-meadow-0da24670f.7.azurestaticapps.net}