spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fatogeral
    username: ${DB_USERNAME:fatogeral}
    password: ${DB_PASSWORD:fatogeral}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

jwt:
  secret: ${JWT_SECRET:fatogeral-secret-key-dev-apenas-local-nao-usar-em-prod}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    org.flywaydb: DEBUG