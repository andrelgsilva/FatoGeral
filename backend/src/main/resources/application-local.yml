spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fatogeral
    username: ${DB_USERNAME:fatogeral}
    password: ${DB_PASSWORD:fatogeral}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

jwt:
  secret: ${JWT_SECRET:fatogeral-secret-key-dev-apenas-local-nao-usar-em-prod}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:3000
    - http://localhost:8080
    - https://*.app.github.dev
    - https://musical-rotary-phone-x7xvr49r69w2p964-5173.app.github.dev
logging:
  level:
    org.flywaydb: DEBUG

springdoc:
  server-url: https://musical-rotary-phone-x7xvr49r69w2p964-8080.app.github.dev
    