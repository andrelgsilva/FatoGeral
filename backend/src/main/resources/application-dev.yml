spring:
datasource:
url: ${DB_URL}
username: ${DB_USERNAME}
password: ${DB_PASSWORD}
driver-class-name: org.postgresql.Driver

jpa:
hibernate:
ddl-auto: update
show-sql: true
properties:
hibernate:
format_sql: true

flyway:
enabled: true
locations: classpath:db/migration
baseline-on-migrate: true

jwt:
secret: ${JWT_SECRET:dev-secret}
expiration: ${JWT_EXPIRATION:86400000}

logging:
level:
org.flywaydb: DEBUG
